name: Build APK from zip
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "*.zip"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
      - name: Bundle three.js inside the app
        run: |
          F=EverestLauncher/app/src/main/assets/three.min.js
          curl -fL --retry 3 -o "$F" https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js || curl -fL --retry 3 -o "$F" https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js
          test "$(stat -c%s "$F")" -gt 100000
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - run: gradle assembleDebug --no-daemon
        working-directory: EverestLauncher
      - uses: actions/upload-artifact@v4
        with:
          name: EverestLauncher-apk
          path: EverestLauncher/app/build/outputs/apk/debug/app-debug.apk
